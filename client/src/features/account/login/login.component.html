<div class="flex justify-center px-4 mt-20">
  <div class="card bg-base-100 w-full max-w-xl shadow-lg p-6 rounded-lg">
    <form class="flex flex-col gap-4 w-full" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="card-title justify-center text-3xl text-primary">Login</div>

      <app-text-input class="mt-2" label="Email" type="email" formControlName="email" />

      <app-text-input label="Password" type="password" formControlName="password" />

      <!-- Forgot Password -->
      <div class="text-right text-sm">
        <a routerLink="/forgot-password" class="text-primary hover:underline cursor-pointer">
          Forgot Password?
        </a>
      </div>

      <!-- <ngx-recaptcha2
        #captchaElem
        [siteKey]="siteKey"
        formControlName="recaptcha"
        (success)="handleSuccess($event)"
      ></ngx-recaptcha2> -->

      <div class="flex items-center justify-end gap-3">
        <button type="button" class="btn">Cancel</button>

        <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid || loading()">
          @if (loading()) {
            <span class="loading loading-spinner"></span>
          }
          Login
        </button>
      </div>

      <!-- Register Link -->
      <div class="text-center text-sm mt-2">
        Don't have an account?
        <a routerLink="/register" class="text-primary font-semibold hover:underline cursor-pointer">
          Register
        </a>
      </div>
    </form>
  </div>
</div>
